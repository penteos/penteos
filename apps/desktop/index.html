<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' ws: wss: http: https:; frame-src http://127.0.0.1:* https:"
    />
    <title>Penteos</title>
    <link rel="icon" type="image/png" href="/src/assets/mark.png" />
    <style>
      /* Splash: shown from the very first paint until the core answers, then it fades out (main.tsx). */
      html, body { margin: 0; background: #08060c; }
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #08060c; transition: opacity .45s ease; }
      #splash img { height: min(72vh, 620px); width: auto; user-select: none; -webkit-user-drag: none; }
      #splash.gone { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="splash"><img src="/src/assets/splash.webp" alt="Penteos" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
