<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Penteos</title>
<style>
  :root {
    --bg: #07060c; --vio: #bcacff; --vio2: #9d8cff; --amber: #f0b43a; --amber2: #e3a857;
    --fg: #ece8f6; --muted: #938ba8; --faint: #352f45;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--fg); font-family: var(--mono); -webkit-user-select: none; user-select: none; cursor: default; }
  .stage { position: relative; height: 100%; width: 100%; overflow: hidden; -webkit-app-region: drag;
    border: 1px solid transparent;
    background: linear-gradient(var(--bg), var(--bg)) padding-box,
      linear-gradient(150deg, var(--vio2), var(--amber2)) border-box; }
  .hero { position: absolute; inset: 0; z-index: 1; }
  .hero img { width: 100%; height: 100%; object-fit: cover; object-position: 52% 32%; }
  #fx { position: absolute; inset: 0; z-index: 2; }
  .scrim { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: 52%;
    background: linear-gradient(180deg, transparent, rgba(7,6,12,.74) 44%, rgba(7,6,12,.96)); }
  .top { position: absolute; z-index: 3; left: 0; right: 0; top: 0; height: 22%;
    background: linear-gradient(180deg, rgba(7,6,12,.5), transparent); }
  .panel { position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 12px; }
  .wordmark { font-size: 27px; font-weight: 800; letter-spacing: 3px; color: #fbf9ff;
    text-shadow: 0 0 14px rgba(157,140,255,.55), 0 0 30px rgba(157,140,255,.25); }
  .wordmark b { color: var(--vio); }
  .tagline { font-size: 9.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-top: -4px; }
  .tagline .c { color: var(--amber); }
  .status { font-size: 10.5px; color: var(--muted); height: 1.3em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status b { color: var(--fg); font-weight: 500; }
  .status .ok { color: var(--amber); }
  .plugins { font-size: 10px; color: var(--muted); height: 1.3em; margin-top: -6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plugins b { color: var(--fg); font-weight: 500; }
  .plugins .warn { color: var(--amber); }
  .update { font-size: 10px; color: var(--amber); height: 1.3em; margin-top: -6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot { display: flex; align-items: center; gap: 10px; }
  .bar { height: 3px; flex: 1; background: #171226; border-radius: 2px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--vio2), var(--amber)); transition: width .3s ease; }
  .pct { font-size: 10px; color: var(--muted); width: 3em; text-align: right; font-variant-numeric: tabular-nums; }
  .cur { display: inline-block; width: 6px; height: 12px; background: var(--amber); margin-left: 3px; vertical-align: -1px; animation: blink 1.1s steps(1) infinite; box-shadow: 0 0 8px var(--amber); }
  @keyframes blink { 50% { opacity: 0; } }
  .scan { position: absolute; inset: 0; z-index: 5; pointer-events: none; opacity: .4;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
  .vig { position: absolute; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(135% 95% at 54% 42%, transparent 50%, rgba(4,3,9,.66) 100%); }
  @media (prefers-reduced-motion: reduce) { .cur { animation: none; } }
</style>
</head>
<body>
  <div class="stage">
    <div class="hero"><img src="spartan.webp" alt="Penteos"></div>
    <canvas id="fx"></canvas>
    <div class="top"></div>
    <div class="scrim"></div>
    <div class="panel">
      <div class="wordmark">PENT<b>E</b>OS</div>
      <div class="tagline">The AI pentest workbench&nbsp;&nbsp;<span class="c">&gt;_</span></div>
      <div class="status" id="status">&nbsp;</div>
      <div class="plugins" id="plugins"></div>
      <div class="update" id="update"></div>
      <div class="foot">
        <div class="bar"><i id="fill"></i></div>
        <div class="pct" id="pct">0%</div>
      </div>
    </div>
    <div class="scan"></div>
    <div class="vig"></div>
  </div>
<script>
  (function () {
    var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    // A few warm embers rising from the torch - subtle, the art already carries the fire.
    var cv = document.getElementById("fx"), ctx = cv.getContext("2d"), W = 0, H = 0, parts = [];
    var COL = ["rgba(240,180,58,", "rgba(227,120,60,", "rgba(188,172,255,"];
    function spawn() {
      var warm = Math.random() < 0.8;
      return { x: Math.random() * W * 0.62, y: H + Math.random() * 20, s: Math.random() < 0.3 ? 2 : 1,
        v: 0.1 + Math.random() * 0.4, drift: (Math.random() - 0.5) * 0.2, a: 0, amax: 0.05 + Math.random() * 0.22,
        c: warm ? (Math.random() < 0.6 ? COL[0] : COL[1]) : COL[2], life: 0, max: 200 + Math.random() * 220 };
    }
    function size() {
      var dpr = window.devicePixelRatio || 1;
      cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
      cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); W = innerWidth; H = innerHeight;
      parts = []; var n = reduce ? 14 : 26;
      for (var i = 0; i < n; i++) { var p = spawn(); p.y = Math.random() * H; p.life = Math.random() * p.max; parts.push(p); }
    }
    size(); addEventListener("resize", size);
    (function loop() {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i]; p.life++; p.y -= p.v; p.x += p.drift;
        p.a = p.life < 36 ? (p.life / 36) * p.amax : p.life > p.max - 50 ? ((p.max - p.life) / 50) * p.amax : p.amax;
        ctx.fillStyle = p.c + Math.max(0, p.a).toFixed(3) + ")";
        ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
        if (p.life > p.max || p.y < -4) parts[i] = spawn();
      }
      requestAnimationFrame(loop);
    })();

    // Real plugin progress, sent by the app while the core loads them.
    var pl = document.getElementById("plugins");
    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; }); }
    window.penteosPlugins = function (p) {
      if (!p) return;
      if (p.safeMode) { pl.innerHTML = '<span class="warn">safe mode</span> · plugins off'; return; }
      if (!p.total) { pl.innerHTML = ""; return; }
      if (p.done < p.total) { pl.innerHTML = 'plugins <b>' + p.done + '/' + p.total + '</b>' + (p.current ? ' · ' + esc(p.current) : ''); return; }
      pl.innerHTML = 'plugins <b>' + p.active + ' ok</b>' + (p.disabled ? ' · <span class="warn">' + p.disabled + ' off</span>' : '');
    };

    // A newer release: said here, installed from the workbench.
    var up = document.getElementById("update");
    window.penteosUpdate = function (u) {
      if (u && u.latest) up.innerHTML = '&gt; update available: <b>v' + esc(u.latest) + '</b> · install it from Help';
    };

    var STEPS = ["scope engine", "interception proxy", "maestro agent", "plugin host", "independent verifier", "vulnerability intel", "privacy vault"];
    var status = document.getElementById("status"), fill = document.getElementById("fill"), pct = document.getElementById("pct");
    var i = 0, T = reduce ? 150 : 720;
    function run() {
      if (i < STEPS.length) {
        status.innerHTML = '<b>' + STEPS[i] + '</b> <span class="ok">ok</span>';
        var p = Math.round(((i + 1) / STEPS.length) * 100);
        fill.style.width = p + "%"; pct.textContent = p + "%";
        i++; setTimeout(run, T);
      } else {
        pct.textContent = "100%";
        status.innerHTML = '<span class="ok">ready</span><span class="cur"></span>';
      }
    }
    setTimeout(run, reduce ? 220 : 820);
  })();
</script>
</body>
</html>
