name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @penteos/schema build
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm electron:check
      # Ubuntu 24.04 restricts the user namespaces Chrome's sandbox needs unless an AppArmor profile
      # allows them; the agent's browser tests run Chrome with its sandbox on, as users do.
      - name: Let Chrome use its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm test

  # The same checks on macOS (Apple Silicon): what breaks on a Mac shows the day it breaks, not at
  # release time. Linux-only mechanisms (bubblewrap, /proc, setcap) have their Mac counterparts
  # tested here.
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @penteos/schema build
      - run: pnpm typecheck
      - run: pnpm test

  # Plugins written against every supported apiVersion, and the ones that ship with Penteos,
  # still validate, activate and do what they must. A change that breaks one does not ship.
  plugin-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @penteos/schema build
      - run: pnpm test:contract
