name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @penteos/schema build
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm electron:check
      - run: pnpm test

  # Plugins written against every supported apiVersion, and the ones that ship with Penteos,
  # still validate, activate and do what they must. A change that breaks one does not ship.
  plugin-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @penteos/schema build
      - run: pnpm test:contract
