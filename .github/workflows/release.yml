name: release

# A tag (v0.1.0, or v0.1.0-rc.1 for a pre-release) builds every Linux package in the release image
# and the macOS apps on a Mac, installs them on clean distributions (x86_64 and arm64) and on Apple
# Silicon and Intel Macs, and publishes the release only if ALL of that passed: one version, every
# system, or nothing. Anyone can read here how each downloaded file was made.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release image (old glibc, so the packages run on old distributions)
        run: docker build -t penteos-release scripts/release
      - name: Packages for x86_64 and arm64
        run: |
          mkdir -p out
          docker run --rm -v "$PWD":/src -v "$PWD/out":/out penteos-release sh scripts/release/build.sh x64,arm64
      - name: The tag matches the app's version
        run: test "v$(cat out/VERSION)" = "${GITHUB_REF_NAME%%-*}" || test "v$(cat out/VERSION)" = "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: out/
          if-no-files-found: error

  # macOS: both chips built on a Mac (Apple's compiler builds the terminal module for either),
  # signed ad hoc, with their own checksums and the installer, ready to be installed below.
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Penteos.app for Apple Silicon and Intel
        run: pnpm --filter @penteos/desktop package -- --arch arm64,x64
      - name: The tag matches the app's version, and the files the installer reads
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          case "$GITHUB_REF" in refs/tags/*) test "v$version" = "${GITHUB_REF_NAME%%-*}" || test "v$version" = "$GITHUB_REF_NAME" ;; esac
          mkdir -p out-mac
          cp apps/desktop/release/penteos-"$version"-mac-*.zip out-mac/
          cp scripts/install.sh out-mac/install.sh
          printf '%s\n' "$version" > out-mac/VERSION
          (cd out-mac && shasum -a 256 penteos-* > SHA256SUMS)
          cat apps/desktop/build/native.json
          ls -la out-mac
      - uses: actions/upload-artifact@v7
        with:
          name: packages-mac
          path: out-mac/
          if-no-files-found: error

  install-mac:
    needs: build-mac
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    name: install on ${{ matrix.runner == 'macos-latest' && 'macOS (Apple Silicon)' || 'macOS (Intel)' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages-mac
          path: pkg
      - name: Install as a user would, verify the signature, run the core end to end, open the app
        run: sh scripts/release/check-install-mac.sh pkg

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, image: "ubuntu:22.04", family: deb }
          - { runner: ubuntu-latest, image: "ubuntu:24.04", family: deb }
          - { runner: ubuntu-latest, image: "debian:12", family: deb }
          - { runner: ubuntu-latest, image: "kalilinux/kali-rolling", family: deb }
          - { runner: ubuntu-latest, image: "fedora:41", family: dnf }
          - { runner: ubuntu-latest, image: "rockylinux:9", family: dnf }
          - { runner: ubuntu-latest, image: "opensuse/leap:15.6", family: zypper }
          - { runner: ubuntu-latest, image: "archlinux:latest", family: appimage }
          - { runner: ubuntu-24.04-arm, image: "ubuntu:24.04", family: deb }
          - { runner: ubuntu-24.04-arm, image: "debian:12", family: deb }
          - { runner: ubuntu-24.04-arm, image: "fedora:41", family: dnf }
    name: install on ${{ matrix.image }} (${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'x86_64' }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: pkg
      # Public resolvers in the test containers: a hiccup of the runners' DNS (it once stopped
      # resolving *.ubuntu.com for hours) must not block a release that is fine.
      - name: Install as a user would, run the core end to end, open the app on a virtual screen
        run: |
          cp scripts/release/check-install.sh scripts/release/e2e-core.mjs pkg/
          docker run --rm --dns 1.1.1.1 --dns 8.8.8.8 -v "$PWD/pkg":/pkg:ro "${{ matrix.image }}" sh /pkg/check-install.sh "${{ matrix.family }}"

  # The one-line installer itself, end to end on a clean system, against the packages just built.
  installer:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: pkg
      - name: curl | sh, as the README says (deb), then as a non-root user (AppImage)
        run: |
          docker run --rm --dns 1.1.1.1 --dns 8.8.8.8 -v "$PWD/pkg":/pkg:ro ubuntu:24.04 sh -c '
            set -e
            apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
            PENTEOS_RELEASES=file:///pkg sh /pkg/install.sh
            test -x /opt/Penteos/penteos
            useradd -m tester
            su tester -c "PENTEOS_RELEASES=file:///pkg sh /pkg/install.sh --appimage && test -x ~/.local/bin/penteos"
          '

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [install, installer, install-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: out
      - uses: actions/download-artifact@v8
        with:
          name: packages-mac
          path: out-mac
      - name: Checksums still match what was tested, then the macOS apps join the Linux packages
        run: |
          (cd out && sha256sum -c SHA256SUMS)
          (cd out-mac && sha256sum -c SHA256SUMS)
          test "$(cat out/VERSION)" = "$(cat out-mac/VERSION)"
          cp out-mac/penteos-*.zip out/
      - name: Release notes from the changelog
        run: |
          version="$(cat out/VERSION)"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Stable names, so releases/latest/download/<name> always gets the newest version
        run: |
          cd out
          version="$(cat VERSION)"
          for f in penteos-"$version"-*; do cp "$f" "penteos-${f#penteos-$version-}"; done
          sha256sum penteos-* > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/penteos-* out/SHA256SUMS out/VERSION out/install.sh \
            --title "Penteos ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag $pre
